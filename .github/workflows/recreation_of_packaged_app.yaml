name: Recreation of Packaged App
on:
   pull_request:
    branches:
      - main
      - release/*
      - feat/PRFR6135/github_action_to_build_fns_package

permissions:
  id-token: write   
  contents: write    # This is required for actions/checkout

jobs:
  DockerBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: arn:aws:iam::263704316862:role/ExtraServicesGithubActionsRole
          aws-region: us-west-2
          role-session-name: MySessionName

      - name: Configure other AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::230177812114:role/ExtraServicesRepositoryPullPusher
          role-chaining: true
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: 230177812114

      - name: checkout to the branch that triggered the workflow
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # determine branch: use github.head_ref for pull_request, otherwise derive from GITHUB_REF
          branch="$BRANCH"
          if [ -z "$branch" ]; then
            branch="${GITHUB_REF#refs/heads/}"
          fi

          git config --global user.name "github-actions"
          git config --global user.email 'github-actions@users.noreply.github.com'
          git fetch origin "$branch"
          git checkout "$branch"

      - name: delete fns-template.tgz
        run: rm -f fns-template.tgz

      - name: pull syndi package
        env:
          REGISTRY: 230177812114
          AWS_REGION: us-west-2
          IMAGE_TAG: latest
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo " 
          profiles:
            default:
              environment: stage.dev" > config

          docker pull ${{ env.REGISTRY }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/pc-syndi:${{ env.IMAGE_TAG }}

          mkdir -p .pack-out

          docker run --rm \
                  -v "$(pwd):/$REPO_NAME" \
                  -w "/$REPO_NAME" \
                  ${{ env.REGISTRY }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/pc-syndi:${{ env.IMAGE_TAG }} \
                  package "/$REPO_NAME" -c "/$REPO_NAME/config" --output-dir "/$REPO_NAME/.pack-out"

          cp .pack-out/*.tar.gz fns-template.tgz || echo "No tar.gz file found in .pack-out"
          rm -rf .pack-out config

      - name: commit and push changes
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # determine branch: use github.head_ref for pull_request, otherwise derive from GITHUB_REF
          branch="$BRANCH"
          if [ -z "$branch" ]; then
            branch="${GITHUB_REF#refs/heads/}"
          fi

          git add .
          git commit -m "recreated packaged app - github action" || echo "no changes to commit"

          # push current HEAD to the same branch
          git push origin "${branch}"
